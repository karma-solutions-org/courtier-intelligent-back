name: Deploy Function to TEST

on:
  workflow_dispatch:
    inputs:
      function_name:
        description: "Name of the function to deploy (ex. members-inviteMember)"
        required: true

jobs:
  deploy-to-firebase-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: ./functions
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "functions/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Prepare Google Application Credentials
        shell: bash
        run: |
          echo "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_DEV }}" | base64 --decode > "google-application-credentials.json"

      - name: Install Firebase
        run: npm install -g firebase-tools

      # --project explicite : ne jamais dépendre du « default » de .firebaserc.
      # « courtier-intelligent » est la codebase de firebase.json : seules nos functions
      # sont visées, jamais celles des autres applications du projet partagé.
      - name: Deploy function
        working-directory: .
        run: firebase deploy --project aibs-partenaire-testing --only functions:courtier-intelligent:${{ github.event.inputs.function_name }} --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: functions/google-application-credentials.json

      - name: Remove credentials file
        if: success() || failure()
        run: |
          rm -f google-application-credentials.json
