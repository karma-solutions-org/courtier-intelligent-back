name: Testing

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./functions
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'functions/package-lock.json'

      # L'emulator Firestore tourne sur Java.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Isolation des cabinets et droits par rôle, vérifiés dans l'emulator Firestore.
      # Projet « demo-* » : l'emulator ne contacte jamais un vrai projet Firebase.
      - name: Firestore rules tests
        working-directory: .
        run: firebase emulators:exec --only firestore --project demo-courtier-intelligent "node --test functions/test/firestore-rules.test.mjs"
