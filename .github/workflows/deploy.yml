name: Deploy To Firebase (TEST)

# Déploie toutes les Cloud Functions de Courtier Intelligent sur aibs-partenaire-testing.
# ⚠️ Projet partagé avec aibs-partenaire et compli-scan :
#   - seule la codebase « courtier-intelligent » est déployée ;
#   - les règles Firestore/Storage ne sont JAMAIS déployées d'ici (elles remplaceraient
#     celles des autres applications) : elles doivent être fusionnées manuellement.

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  deploy-to-firebase-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./functions
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "functions/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Prepare Google Application Credentials
        shell: bash
        run: |
          echo "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_DEV }}" | base64 --decode > "google-application-credentials.json"

      - name: Install Firebase
        run: npm install -g firebase-tools

      - name: Deploy functions
        working-directory: .
        run: firebase deploy --project aibs-partenaire-testing --only functions:courtier-intelligent --non-interactive --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: functions/google-application-credentials.json

      - name: Remove credentials file
        if: success() || failure()
        run: |
          rm -f google-application-credentials.json
