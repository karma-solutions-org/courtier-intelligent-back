name: Deploy To Firebase

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy-to-firebase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The environment records every deployment in the repository's Deployments
    # history, which replaces the marker commit this job used to push to main.
    environment: production
    permissions:
      contents: read
      # Lets the job request a GitHub OIDC token for keyless Google Cloud auth.
      id-token: write
    defaults:
      run:
        working-directory: ./functions
    env:
      # Pinned here rather than in devDependencies: only the deploy jobs need the
      # CLI, and its ~500 packages would otherwise slow every CI install.
      FIREBASE_TOOLS_VERSION: 15.32.1

    steps:
      # A release event checks out the released tag, so this deploys exactly
      # what was released, not whatever main has moved on to since.
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up project
        uses: ./.github/actions/setup
        with:
          working-directory: functions

      # Nothing else gates a release on the tests, so a red main would deploy.
      - name: Testing
        run: npm run test

      # Keyless: exchanges the job's GitHub OIDC token for short-lived
      # credentials of the deploy service account. Only this repository's
      # `production` environment may impersonate it. The generated credentials
      # file lives outside ./functions, is deleted when the job ends, and also
      # authenticates gcloud for the VPC step below.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: **projects/1045695684946/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: **github-action-deploy@aibs-part.iam.gserviceaccount.com
          project_id: **aibs-part

      - name: Deploy
        run: npx --yes "firebase-tools@$FIREBASE_TOOLS_VERSION" deploy --project aibs-part --only functions --non-interactive --force

      # Firebase Functions v2 SDK can't express Direct VPC egress, so the shared
      # VPC is applied to the Elasticsearch functions post-deploy on Cloud Run.
      - name: Apply shared VPC to Elasticsearch functions
        run: |
          for svc in $(npm run --silent list-vpc); do
            echo "Applying shared VPC to $svc"
            gcloud run services update "$svc" \
              --region=europe-west3 \
              --project=aibs-part \
              --network=projects/shared-vpc-container/global/networks/shared-vpc \
              --subnet=projects/shared-vpc-container/regions/europe-west3/subnetworks/shared-vpc-subnet \
              --vpc-egress=all-traffic \
              --quiet
          done
