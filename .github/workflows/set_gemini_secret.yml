name: Set Gemini API key

# Copie la clé Gemini, saisie dans les secrets GitHub de l'environnement choisi (secret `GEMINI_API_KEY`), vers
# Google Secret Manager, où la function `ia-proxy` la lit. À lancer à la main : à la première mise en place et
# à chaque changement de clé, puis redéployer `ia-proxy` (une function lit son secret au démarrage).
#
# La clé ne passe jamais par un champ de saisie du workflow (les valeurs saisies au lancement apparaissent en clair
# dans l'historique des exécutions) : elle vient uniquement des secrets GitHub, que les journaux masquent.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Projet Firebase visé'
        required: true
        type: choice
        options:
          - testing
          - production

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  set-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # L'environnement GitHub porte le secret GEMINI_API_KEY et protège l'accès au compte de service.
    environment: ${{ inputs.target }}
    permissions:
      contents: read
      # Lets the job request a GitHub OIDC token for keyless Google Cloud auth.
      id-token: write
    env:
      PROJECT_ID: ${{ inputs.target == 'production' && 'aibs-part' || 'aibs-partenaire-testing' }}
      SECRET_NAME: GEMINI_API_KEY

    steps:
      - name: Check that the GitHub secret exists
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Secret GEMINI_API_KEY absent de l'environnement GitHub « ${{ inputs.target }} » (Settings → Environments)."
            exit 1
          fi

      # Keyless, comme les workflows de déploiement : même fournisseur et même compte de service par environnement.
      - name: Authenticate to Google Cloud (testing)
        if: inputs.target == 'testing'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/244765868255/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-action@aibs-partenaire-testing.iam.gserviceaccount.com
          project_id: aibs-partenaire-testing

      - name: Authenticate to Google Cloud (production)
        if: inputs.target == 'production'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1045695684946/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-action-deploy@aibs-part.iam.gserviceaccount.com
          project_id: aibs-part

      # Le secret est créé au premier lancement, avec le label que pose la CLI Firebase pour ses propres secrets.
      - name: Create the secret if needed
        run: |
          if ! gcloud secrets describe "$SECRET_NAME" --project="$PROJECT_ID" >/dev/null 2>&1; then
            gcloud secrets create "$SECRET_NAME" --project="$PROJECT_ID" \
              --replication-policy=automatic --labels=firebase-managed=true
          fi

      # La clé passe par l'entrée standard : jamais dans la ligne de commande, ni dans un fichier.
      - name: Add the key as a new version
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: printf '%s' "$GEMINI_API_KEY" | gcloud secrets versions add "$SECRET_NAME" --project="$PROJECT_ID" --data-file=-

      - name: Next step
        run: echo "::notice::Clé enregistrée dans Secret Manager ($PROJECT_ID). Redéployez ia-proxy pour qu'il l'utilise."
