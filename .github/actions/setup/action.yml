name: Set up project
description: Install the Node.js version pinned in .nvmrc and the locked npm dependencies.

inputs:
  working-directory:
    description: Directory holding package.json and package-lock.json.
    default: '.'
  registry-url:
    description: >-
      npm registry to authenticate against with the workflow token, e.g.
      https://npm.pkg.github.com for @karma-solutions-org packages. Empty for none.
    default: ''

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm
        # `defaults.run.working-directory` does not reach `uses:` steps, so the
        # lockfile path is spelled out or the cache keys on the wrong lockfile.
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
        registry-url: ${{ inputs.registry-url }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci
      env:
        NODE_AUTH_TOKEN: ${{ github.token }}
